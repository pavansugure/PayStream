spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# JWT secret used by the Gateway to validate tokens issued by Auth Service.
# The actual secret is supplied through the environment variable.
jwt.secret=${PAYSTREAM_JWT_SECRET}

# --------------------------------------------------
# Auth Service Route
# --------------------------------------------------

# Requests to /api/auth/** are forwarded to AUTH-SERVICE
# through Eureka service discovery and Spring Cloud LoadBalancer.
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**