spring.application.name=auth-service

server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=localhost:8081

spring.datasource.url=jdbc:mysql://localhost:3306/paystream_auth
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT signing secret is supplied through an environment variable.
# The actual secret is intentionally not stored in Git.	
jwt.secret=${PAYSTREAM_JWT_SECRET}

# JWT validity duration: 1 hour
jwt.expiration-ms=3600000