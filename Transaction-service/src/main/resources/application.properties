spring.application.name=transaction-service

server.port=8082

# Eureka configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Advertise localhost to Eureka for local development.
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=localhost:8082

# Transaction Service database
spring.datasource.url=jdbc:mysql://localhost:3306/paystream_transaction
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT verification secret.
# The actual secret is supplied through the environment variable
# and is never stored in Git.
jwt.secret=${PAYSTREAM_JWT_SECRET}